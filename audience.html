<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCaption - Audience</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8fafc;
        }
        
        h1 span {
            color: #38bdf8;
        }
        
        .session-badge {
            font-size: 0.75rem;
            padding: 0.375rem 0.75rem;
            background: #334155;
            border-radius: 9999px;
            color: #94a3b8;
        }
        
        .lang-selector {
            display: flex;
            gap: 0.5rem;
        }
        
        .lang-btn {
            flex: 1;
            padding: 0.625rem 0.75rem;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
        }
        
        .lang-btn:hover {
            border-color: #475569;
            color: #f1f5f9;
        }
        
        .lang-btn.active {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
        }
        
        .lang-flag {
            font-size: 1.125rem;
        }
        
        main {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        
        .caption-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem 1rem 2.5rem;
        }

        .caption-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            min-height: 140px;
        }

        .caption-text {
            font-size: 2.5rem;
            line-height: 1.45;
            text-align: center;
            color: #f8fafc;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-weight: 700;
            padding: 0.5rem 1.25rem;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 0.4rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            animation: subtitleFadeIn 0.2s ease-out;
            max-width: 92%;
        }

        @keyframes subtitleFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .caption-text.interim {
            color: #cbd5e1;
        }

        .caption-placeholder {
            font-size: 1.125rem;
            color: #64748b;
            text-align: center;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-bar {
            padding: 1rem 1.5rem;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }
        
        .status-indicator.connected {
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.error {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            border: 1px solid #ef4444;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            display: none;
        }
        
        .error-message.active {
            display: block;
        }
        
        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.25rem;
            color: #ef4444;
            margin-bottom: 0.5rem;
        }
        
        .error-desc {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .font-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.5rem 0;
        }
        
        .font-btn {
            width: 36px;
            height: 36px;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .font-btn:hover {
            border-color: #475569;
            color: #f1f5f9;
        }
        
        .font-size-label {
            font-size: 0.75rem;
            color: #64748b;
            min-width: 3rem;
            text-align: center;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .caption-text {
                font-size: 2rem;
            }
            
            .lang-btn {
                font-size: 0.75rem;
                padding: 0.5rem;
            }
        }
        
        @media (max-width: 375px) {
            .caption-text {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Live<span>Caption</span></h1>
            <span class="session-badge" id="session-badge">Session: ---</span>
        </div>
        <div class="lang-selector">
            <button class="lang-btn active" data-lang="en" onclick="selectLang('en')">
                <span class="lang-flag">🇺🇸</span>
                <span>English</span>
            </button>
            <button class="lang-btn" data-lang="th" onclick="selectLang('th')">
                <span class="lang-flag">🇹🇭</span>
                <span>ภาษาไทย</span>
            </button>
            <button class="lang-btn" data-lang="zh" onclick="selectLang('zh')">
                <span class="lang-flag">🇨🇳</span>
                <span>中文</span>
            </button>
        </div>
    </header>
    
    <main>
        <div class="caption-container">
            <div class="caption-wrapper" id="caption-wrapper">
                <div class="caption-placeholder" id="caption-placeholder">
                    <div class="spinner"></div>
                    <div>Waiting for captions...</div>
                </div>
                <div class="caption-text" id="caption-text" style="display: none;"></div>
            </div>
        </div>
    </main>
    
    <div class="status-bar">
        <div class="font-controls">
            <button class="font-btn" onclick="changeFontSize(-0.25)" title="Decrease font size">A-</button>
            <span class="font-size-label" id="font-size-label">1.75rem</span>
            <button class="font-btn" onclick="changeFontSize(0.25)" title="Increase font size">A+</button>
        </div>
        <span class="status-indicator" id="status-indicator"></span>
        <span id="status-text">Connecting...</span>
    </div>
    
    <div class="error-message" id="error-message">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div class="error-desc">Please check your internet connection and refresh.</div>
    </div>
    
    <script>
        // Get session from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        
        let currentLang = 'en';
        let supabaseClient = null;
        let subscription = null;
        let SUPABASE_URL = '';
        let SUPABASE_KEY = '';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            if (!sessionId) {
                showError('No session ID provided. Please scan the QR code again.');
                return;
            }
            
            document.getElementById('session-badge').textContent = `Session: ${sessionId}`;
            
            // Fetch Supabase config from API
            try {
                const response = await fetch('/api/config');
                if (!response.ok) {
                    throw new Error('Failed to load config');
                }
                const config = await response.json();
                SUPABASE_URL = config.supabase_url;
                SUPABASE_KEY = config.supabase_key;
                
                if (!SUPABASE_URL || !SUPABASE_KEY) {
                    showError('Supabase not configured on server');
                    document.getElementById('status-text').textContent = 'Not configured';
                    return;
                }
            } catch (error) {
                showError('Failed to load configuration: ' + error.message);
                return;
            }
            
            // Initialize Supabase
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } catch (error) {
                showError('Failed to initialize Supabase: ' + error.message);
                return;
            }
            
            // Subscribe to realtime updates
            subscribeToCaptions();
            
            // Load initial caption
            loadInitialCaption();
        });
        
        function selectLang(lang) {
            currentLang = lang;
            
            // Clear state when switching languages
            lastEnText = '';
            lastTranslatedText = '';
            lastDisplayedText = '';
            resetLineHistory();
            
            // Update button states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            
            // Refresh caption display
            loadInitialCaption();
        }
        
        let pollInterval = null;
        
        async function subscribeToCaptions() {
            try {
                console.log('Connecting to Supabase...', SUPABASE_URL);
                console.log('Session ID:', sessionId);
                
                // Test Supabase connection first
                const { data: testData, error: testError } = await supabaseClient
                    .from('captions')
                    .select('count', { count: 'exact', head: true });
                
                if (testError) {
                    console.error('Supabase connection test failed:', testError);
                    showError('Database connection failed: ' + testError.message);
                    updateConnectionStatus('error');
                    return;
                }
                
                console.log('Supabase connection test passed');
                
                // Try realtime subscription
                subscription = supabaseClient
                    .channel(`captions:${sessionId}`)
                    .on(
                        'postgres_changes',
                        {
                            event: '*',
                            schema: 'public',
                            table: 'captions',
                            filter: `session_id=eq.${sessionId}`
                        },
                        (payload) => {
                            console.log('Received realtime update:', payload);
                            handleCaptionUpdate(payload.new);
                        }
                    )
                    .subscribe((status, err) => {
                        console.log('Subscription status:', status);
                        if (status === 'SUBSCRIBED') {
                            updateConnectionStatus('connected');
                            console.log('Realtime subscription active');
                        } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                            console.warn('Realtime failed, switching to polling mode');
                            startPolling();
                        }
                    });
                    
            } catch (error) {
                console.error('Subscription error:', error);
                startPolling();
            }
        }
        
        // Fallback polling mechanism
        function startPolling() {
            console.log('Starting polling mode (2s interval)');
            updateConnectionStatus('polling');
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(loadInitialCaption, 2000);
        }
        
        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }
        
        async function loadInitialCaption() {
            try {
                const { data, error } = await supabaseClient
                    .from('captions')
                    .select('*')
                    .eq('session_id', sessionId)
                    .single();
                
                if (error && error.code !== 'PGRST116') {
                    throw error;
                }
                
                if (data && data[currentLang]) {
                    updateCurrentLine(data[currentLang]);
                }
                
            } catch (error) {
                console.error('Error loading initial caption:', error);
            }
        }
        
        let lastEnText = '';
        let lastTranslatedText = '';
        
        function handleCaptionUpdate(data) {
            if (!data) return;
            
            const enText = data['en'] || '';
            const langText = data[currentLang] || '';
            
            // If viewing English, show English immediately
            if (currentLang === 'en') {
                if (enText && enText.trim() && enText !== lastEnText) {
                    lastEnText = enText;
                    updateCurrentLine(enText);
                }
                return;
            }
            
            // For other languages: only show translated text, never flash English
            if (langText && langText.trim() && langText !== lastTranslatedText) {
                lastTranslatedText = langText;
                updateCurrentLine(langText);
            }
            // Track English changes but don't display them
            if (enText && enText.trim()) {
                lastEnText = enText;
            }
        }
        
        let lastDisplayedText = '';
        let lastSubtitle = '';
        const SUBTITLE_MAX_CHARS = 80;     // Hard cap for one subtitle line
        const SUBTITLE_FALLBACK_CHARS = 60; // For text without punctuation (Thai, etc.)
        
        // Extract just the CURRENT sentence (text after the last sentence boundary)
        function extractCurrentSubtitle(text) {
            const trimmed = text.trim();
            if (!trimmed) return '';
            
            // Find the last sentence-ending punctuation: . ? ! 。？！
            // We want the text AFTER it (the in-progress next sentence)
            const matches = [...trimmed.matchAll(/[.?!。？！]/gu)];
            
            if (matches.length === 0) {
                // No punctuation found (e.g. Thai) — just keep a trailing window
                if (trimmed.length <= SUBTITLE_FALLBACK_CHARS) return trimmed;
                let tail = trimmed.slice(-SUBTITLE_FALLBACK_CHARS);
                // Snap to a word boundary if there's a space within reasonable range
                const firstSpace = tail.indexOf(' ');
                if (firstSpace > 0 && firstSpace < 30) {
                    tail = tail.slice(firstSpace + 1);
                }
                // Strip orphan combining marks at the start (Thai tone marks, vowels)
                // so we never display a broken character cluster
                tail = tail.replace(/^[\p{M}\p{Mn}\p{Mc}]+/u, '');
                return tail;
            }
            
            // Get text after the LAST sentence boundary
            const lastMatch = matches[matches.length - 1];
            const afterLast = trimmed.slice(lastMatch.index + 1).trim();
            
            // Helper: cap length and strip orphan combining marks at the start
            const cap = (s) => {
                let out = s.length > SUBTITLE_MAX_CHARS ? s.slice(-SUBTITLE_MAX_CHARS) : s;
                return out.replace(/^[\p{M}\p{Mn}\p{Mc}]+/u, '');
            };
            
            if (afterLast) {
                // We're mid-way through the next sentence — show it
                return cap(afterLast);
            }
            
            // Text ends with punctuation — show the LAST completed sentence briefly
            if (matches.length >= 2) {
                const prevMatch = matches[matches.length - 2];
                const lastSentence = trimmed.slice(prevMatch.index + 1, lastMatch.index + 1).trim();
                return cap(lastSentence);
            }
            
            // Only one sentence in total — show it
            const onlySentence = trimmed.slice(0, lastMatch.index + 1);
            return cap(onlySentence);
        }
        
        function updateCurrentLine(text, isInterim = false) {
            const placeholder = document.getElementById('caption-placeholder');
            const captionText = document.getElementById('caption-text');
            
            if (!text || !text.trim()) return;
            if (text === lastDisplayedText) return;
            lastDisplayedText = text;
            
            placeholder.style.display = 'none';
            captionText.style.display = 'block';
            
            const subtitle = extractCurrentSubtitle(text);
            if (!subtitle) return;
            
            captionText.className = isInterim ? 'caption-text interim' : 'caption-text';
            captionText.textContent = subtitle;
            
            // Re-trigger fade animation only when the subtitle actually changes meaningfully
            // (i.e. when the new sentence replaces an old one, not on every word append)
            if (subtitle !== lastSubtitle) {
                const isReplacement = lastSubtitle && !subtitle.startsWith(lastSubtitle);
                if (isReplacement) {
                    captionText.style.animation = 'none';
                    void captionText.offsetWidth;
                    captionText.style.animation = '';
                }
                lastSubtitle = subtitle;
            }
        }
        
        function resetLineHistory() {
            lastDisplayedText = '';
            lastSubtitle = '';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function updateConnectionStatus(status) {
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            
            indicator.className = 'status-indicator ' + status;
            
            switch (status) {
                case 'connected':
                    statusText.textContent = 'Connected (Realtime)';
                    break;
                case 'polling':
                    statusText.textContent = 'Connected (Polling)';
                    indicator.style.background = '#ffa500';
                    break;
                case 'error':
                    statusText.textContent = 'Disconnected';
                    break;
                default:
                    statusText.textContent = 'Connecting...';
            }
        }
        
        function showError(message) {
            document.getElementById('error-message').querySelector('.error-desc').textContent = message;
            document.getElementById('error-message').classList.add('active');
            document.getElementById('caption-placeholder').style.display = 'none';
        }
        
        // Font size control
        let currentFontSize = 1.75;  // rem
        
        function changeFontSize(delta) {
            currentFontSize = Math.max(1, Math.min(4, currentFontSize + delta));
            document.getElementById('caption-text').style.fontSize = currentFontSize + 'rem';
            document.getElementById('font-size-label').textContent = currentFontSize.toFixed(2) + 'rem';
            // Persist preference
            try { localStorage.setItem('lc_font_size', currentFontSize); } catch(e) {}
        }
        
        // Restore saved font size
        try {
            const saved = localStorage.getItem('lc_font_size');
            if (saved) {
                currentFontSize = parseFloat(saved);
                document.addEventListener('DOMContentLoaded', () => {
                    document.getElementById('caption-text').style.fontSize = currentFontSize + 'rem';
                    document.getElementById('font-size-label').textContent = currentFontSize.toFixed(2) + 'rem';
                });
            }
        } catch(e) {}
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (subscription) {
                subscription.unsubscribe();
            }
        });
    </script>
</body>
</html>
