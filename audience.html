<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCaption - Audience</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex-shrink: 0;
        }
        
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8fafc;
        }
        
        h1 span {
            color: #38bdf8;
        }
        
        .session-badge {
            font-size: 0.75rem;
            padding: 0.375rem 0.75rem;
            background: #334155;
            border-radius: 9999px;
            color: #94a3b8;
        }
        
        .lang-selector {
            display: flex;
            gap: 0.5rem;
        }
        
        .lang-btn {
            flex: 1;
            padding: 0.625rem 0.75rem;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
        }
        
        .lang-btn:hover {
            border-color: #475569;
            color: #f1f5f9;
        }
        
        .lang-btn.active {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
        }
        
        .lang-flag {
            font-size: 1.125rem;
        }
        
        main {
            flex: 1;
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .caption-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            position: relative;
            min-height: 0;
        }

        .history-scroll {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 1rem 0.5rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-track { background: transparent; }
        .history-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        .history-spacer { flex: 1; }

        .history-line {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #475569;
            text-align: center;
            padding: 0.125rem 0.5rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .live-area {
            flex-shrink: 0;
            padding: 0.75rem 0.5rem 0.5rem;
            text-align: center;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, transparent, #0f172a 20%);
        }

        .scroll-btn {
            position: absolute;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 9999px;
            padding: 0.5rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            z-index: 10;
            white-space: nowrap;
        }

        .scroll-btn.visible { display: block; }

        .caption-text {
            font-size: 2.5rem;
            line-height: 1.4;
            text-align: center;
            color: #f8fafc;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            animation: subtitleFadeIn 0.25s ease-out;
            max-width: 90%;
        }
        
        @keyframes subtitleFadeIn {
            from { opacity: 0.4; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .caption-text.interim {
            color: #cbd5e1;
            font-style: italic;
        }
        
        .caption-placeholder {
            font-size: 1.125rem;
            color: #64748b;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-bar {
            flex-shrink: 0;
            padding: 0.75rem 1.5rem;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }
        
        .status-indicator.connected {
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.error {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            border: 1px solid #ef4444;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            display: none;
        }
        
        .error-message.active {
            display: block;
        }
        
        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.25rem;
            color: #ef4444;
            margin-bottom: 0.5rem;
        }
        
        .error-desc {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .font-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.5rem 0;
        }
        
        .font-btn {
            width: 36px;
            height: 36px;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .font-btn:hover {
            border-color: #475569;
            color: #f1f5f9;
        }
        
        .font-size-label {
            font-size: 0.75rem;
            color: #64748b;
            min-width: 3rem;
            text-align: center;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .caption-text { font-size: 2rem; }
            .history-line { font-size: 1rem; }
            .lang-btn { font-size: 0.75rem; padding: 0.5rem; }
        }
        
        @media (max-width: 375px) {
            .caption-text {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Live<span>Caption</span></h1>
            <span class="session-badge" id="session-badge">Session: ---</span>
        </div>
        <div class="lang-selector">
            <button class="lang-btn active" data-lang="en" onclick="selectLang('en')">
                <span class="lang-flag">🇺🇸</span>
                <span>English</span>
            </button>
            <button class="lang-btn" data-lang="th" onclick="selectLang('th')">
                <span class="lang-flag">🇹🇭</span>
                <span>ภาษาไทย</span>
            </button>
            <button class="lang-btn" data-lang="zh" onclick="selectLang('zh')">
                <span class="lang-flag">🇨🇳</span>
                <span>中文</span>
            </button>
        </div>
    </header>
    
    <main>
        <div class="caption-container">
            <div class="history-scroll" id="history-scroll">
                <div class="history-spacer"></div>
            </div>
            <div class="live-area">
                <div class="caption-placeholder" id="caption-placeholder">
                    <div class="spinner"></div>
                    <div>Waiting for captions...</div>
                </div>
                <div class="caption-text" id="caption-text" style="display: none;"></div>
            </div>
            <button class="scroll-btn" id="scroll-btn" onclick="scrollToLive()">↓ Back to live</button>
        </div>
    </main>
    
    <div class="status-bar">
        <div class="font-controls">
            <button class="font-btn" onclick="changeFontSize(-0.25)" title="Decrease font size">A-</button>
            <span class="font-size-label" id="font-size-label">1.75rem</span>
            <button class="font-btn" onclick="changeFontSize(0.25)" title="Increase font size">A+</button>
        </div>
        <span class="status-indicator" id="status-indicator"></span>
        <span id="status-text">Connecting...</span>
    </div>
    
    <div class="error-message" id="error-message">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div class="error-desc">Please check your internet connection and refresh.</div>
    </div>
    
    <script>
        // Get session from URL — supports /audience.html?session=ID and /s/ID
        const urlParams = new URLSearchParams(window.location.search);
        const pathMatch = window.location.pathname.match(/^\/s\/([^/]+)$/);
        const sessionId = urlParams.get('session') || (pathMatch && pathMatch[1]);
        
        let currentLang = 'en';
        let firebaseDb = null;
        let sessionRef = null;
        let connectedRef = null;
        let lastSnapshot = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            if (!sessionId) {
                showError('No session ID provided. Please scan the QR code again.');
                return;
            }

            document.getElementById('session-badge').textContent = `Session: ${sessionId}`;

            // Scroll detection — show back-to-live button when user scrolls up
            const historyScroll = document.getElementById('history-scroll');
            historyScroll.addEventListener('scroll', () => {
                const atBottom = historyScroll.scrollHeight - historyScroll.scrollTop - historyScroll.clientHeight < 80;
                userScrolledUp = !atBottom;
                document.getElementById('scroll-btn').classList.toggle('visible', userScrolledUp);
            });

            // Fetch Firebase config from API
            let config;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                let response;
                try {
                    response = await fetch('/api/config', { signal: controller.signal });
                } finally {
                    clearTimeout(timeoutId);
                }
                if (!response.ok) {
                    throw new Error('Failed to load config');
                }
                config = await response.json();

                if (!config.firebase_database_url || !config.firebase_api_key) {
                    showError('Firebase not configured on server');
                    document.getElementById('status-text').textContent = 'Not configured';
                    return;
                }
            } catch (error) {
                showError('Failed to load configuration: ' + error.message);
                return;
            }

            // Initialize Firebase
            try {
                firebase.initializeApp({
                    apiKey: config.firebase_api_key,
                    authDomain: config.firebase_auth_domain,
                    databaseURL: config.firebase_database_url,
                    projectId: config.firebase_project_id,
                    appId: config.firebase_app_id
                });
                firebaseDb = firebase.database();
            } catch (error) {
                showError('Failed to initialize Firebase: ' + error.message);
                return;
            }

            // Subscribe to realtime updates — the Firebase client SDK owns
            // its own persistent connection with automatic reconnection, so
            // there's no polling fallback or watchdog to maintain here.
            subscribeToCaptions();
            watchConnectionState();
        });

        function selectLang(lang) {
            currentLang = lang;

            // Clear state when switching languages
            lastEnText = '';
            lastTranslatedText = '';
            lastDisplayedText = '';
            resetLineHistory();

            // Update button states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // Refresh caption display from the last known snapshot
            if (lastSnapshot) handleCaptionUpdate(lastSnapshot);
        }

        function subscribeToCaptions() {
            sessionRef = firebaseDb.ref('sessions/' + sessionId);
            // 'value' fires immediately with the current data on attach,
            // then again on every subsequent change — covers both the
            // initial load and live updates.
            sessionRef.on('value', (snapshot) => {
                lastSnapshot = snapshot.val();
                handleCaptionUpdate(lastSnapshot);
            }, (error) => {
                console.error('Firebase read failed:', error);
                showError('Database connection failed: ' + error.message);
                updateConnectionStatus('error');
            });
        }

        function watchConnectionState() {
            connectedRef = firebaseDb.ref('.info/connected');
            connectedRef.on('value', (snapshot) => {
                updateConnectionStatus(snapshot.val() === true ? 'connected' : 'connecting');
            });
        }

        let lastEnText = '';
        let lastTranslatedText = '';

        function handleCaptionUpdate(data) {
            if (!data) return;

            const enText = data['en'] || '';
            const langText = data[currentLang] || '';
            
            // If viewing English, show English immediately
            if (currentLang === 'en') {
                if (enText && enText.trim() && enText !== lastEnText) {
                    lastEnText = enText;
                    updateCurrentLine(enText);
                }
                return;
            }
            
            // For other languages: only show translated text, never flash English
            if (langText && langText.trim() && langText !== lastTranslatedText) {
                lastTranslatedText = langText;
                updateCurrentLine(langText);
            }
            // Track English changes but don't display them
            if (enText && enText.trim()) {
                lastEnText = enText;
            }
        }
        
        let lastDisplayedText = '';
        let lastSubtitle = '';
        let knownSentences = [];
        let userScrolledUp = false;
        const SUBTITLE_MAX_CHARS = 80;
        const SUBTITLE_FALLBACK_CHARS = 60;
        
        // Extract all completed sentences (for history)
        function extractSentences(text) {
            const trimmed = text.trim();
            const result = [];
            const re = /[.?!。？！]/g;
            let start = 0, match;
            while ((match = re.exec(trimmed)) !== null) {
                const s = trimmed.slice(start, match.index + 1).trim();
                if (s) result.push(s);
                start = match.index + 1;
                while (start < trimmed.length && trimmed[start] === ' ') start++;
            }
            return result;
        }

        function addHistoryLine(text) {
            const scroll = document.getElementById('history-scroll');
            const div = document.createElement('div');
            div.className = 'history-line';
            div.textContent = text;
            scroll.appendChild(div);
            if (!userScrolledUp) scrollToLive();
        }

        function scrollToLive() {
            const scroll = document.getElementById('history-scroll');
            scroll.scrollTop = scroll.scrollHeight;
            userScrolledUp = false;
            document.getElementById('scroll-btn').classList.remove('visible');
        }

        // Extract just the CURRENT sentence (text after the last sentence boundary)
        function extractCurrentSubtitle(text) {
            const trimmed = text.trim();
            if (!trimmed) return '';
            
            // Find the last sentence-ending punctuation: . ? ! 。？！
            // We want the text AFTER it (the in-progress next sentence)
            const matches = [...trimmed.matchAll(/[.?!。？！]/gu)];
            
            if (matches.length === 0) {
                // No punctuation found (e.g. Thai) — just keep a trailing window
                if (trimmed.length <= SUBTITLE_FALLBACK_CHARS) return trimmed;
                let tail = trimmed.slice(-SUBTITLE_FALLBACK_CHARS);
                // Snap to a word boundary if there's a space within reasonable range
                const firstSpace = tail.indexOf(' ');
                if (firstSpace > 0 && firstSpace < 30) {
                    tail = tail.slice(firstSpace + 1);
                }
                // Strip orphan combining marks at the start (Thai tone marks, vowels)
                // so we never display a broken character cluster
                tail = tail.replace(/^[\p{M}\p{Mn}\p{Mc}]+/u, '');
                return tail;
            }
            
            // Get text after the LAST sentence boundary
            const lastMatch = matches[matches.length - 1];
            const afterLast = trimmed.slice(lastMatch.index + 1).trim();
            
            // Helper: cap length and strip orphan combining marks at the start
            const cap = (s) => {
                let out = s.length > SUBTITLE_MAX_CHARS ? s.slice(-SUBTITLE_MAX_CHARS) : s;
                return out.replace(/^[\p{M}\p{Mn}\p{Mc}]+/u, '');
            };
            
            if (afterLast) {
                // We're mid-way through the next sentence — show it
                return cap(afterLast);
            }
            
            // Text ends with punctuation — show the LAST completed sentence briefly
            if (matches.length >= 2) {
                const prevMatch = matches[matches.length - 2];
                const lastSentence = trimmed.slice(prevMatch.index + 1, lastMatch.index + 1).trim();
                return cap(lastSentence);
            }
            
            // Only one sentence in total — show it
            const onlySentence = trimmed.slice(0, lastMatch.index + 1);
            return cap(onlySentence);
        }
        
        function updateCurrentLine(text, isInterim = false) {
            const placeholder = document.getElementById('caption-placeholder');
            const captionText = document.getElementById('caption-text');

            if (!text || !text.trim()) return;
            if (text === lastDisplayedText) return;
            lastDisplayedText = text;

            placeholder.style.display = 'none';
            captionText.style.display = 'block';

            // Push newly completed sentences into history
            const sentences = extractSentences(text);
            for (let i = knownSentences.length; i < sentences.length; i++) {
                addHistoryLine(sentences[i]);
            }
            knownSentences = sentences;

            const subtitle = extractCurrentSubtitle(text);
            if (!subtitle) return;

            captionText.className = isInterim ? 'caption-text interim' : 'caption-text';
            captionText.textContent = subtitle;

            if (subtitle !== lastSubtitle) {
                const isReplacement = lastSubtitle && !subtitle.startsWith(lastSubtitle);
                if (isReplacement) {
                    captionText.style.animation = 'none';
                    void captionText.offsetWidth;
                    captionText.style.animation = '';
                }
                lastSubtitle = subtitle;
            }
        }
        
        function resetLineHistory() {
            lastDisplayedText = '';
            lastSubtitle = '';
            knownSentences = [];
            userScrolledUp = false;
            const scroll = document.getElementById('history-scroll');
            if (scroll) scroll.querySelectorAll('.history-line').forEach(l => l.remove());
            document.getElementById('scroll-btn').classList.remove('visible');
            const captionText = document.getElementById('caption-text');
            if (captionText) captionText.style.display = 'none';
            const placeholder = document.getElementById('caption-placeholder');
            if (placeholder) placeholder.style.display = 'flex';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function updateConnectionStatus(status) {
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            indicator.className = 'status-indicator ' + status;
            indicator.style.background = '';

            switch (status) {
                case 'connected':
                    statusText.textContent = 'Connected';
                    break;
                case 'error':
                    statusText.textContent = 'Disconnected';
                    break;
                default:
                    statusText.textContent = 'Connecting...';
            }
        }
        
        function showError(message) {
            document.getElementById('error-message').querySelector('.error-desc').textContent = message;
            document.getElementById('error-message').classList.add('active');
            document.getElementById('caption-placeholder').style.display = 'none';
        }
        
        // Font size control
        let currentFontSize = 1.75;  // rem
        
        function changeFontSize(delta) {
            currentFontSize = Math.max(1, Math.min(4, currentFontSize + delta));
            document.getElementById('caption-text').style.fontSize = currentFontSize + 'rem';
            document.getElementById('font-size-label').textContent = currentFontSize.toFixed(2) + 'rem';
            // Persist preference
            try { localStorage.setItem('lc_font_size', currentFontSize); } catch(e) {}
        }
        
        // Restore saved font size
        try {
            const saved = localStorage.getItem('lc_font_size');
            if (saved) {
                currentFontSize = parseFloat(saved);
                document.addEventListener('DOMContentLoaded', () => {
                    document.getElementById('caption-text').style.fontSize = currentFontSize + 'rem';
                    document.getElementById('font-size-label').textContent = currentFontSize.toFixed(2) + 'rem';
                });
            }
        } catch(e) {}
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (subscription) {
                subscription.unsubscribe();
            }
        });
    </script>
</body>
</html>
