<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCaption - Presenter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #f8fafc;
        }
        
        h1 span {
            color: #38bdf8;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .status.waiting {
            background: #334155;
            color: #94a3b8;
        }
        
        .status.live {
            background: #dc2626;
            color: #fef2f2;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        
        main {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        
        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 1rem;
        }
        
        button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #0ea5e9;
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: #dc2626;
            color: #fef2f2;
        }
        
        .btn-danger:hover {
            background: #b91c1c;
        }
        
        .qr-section {
            display: none;
            text-align: center;
        }
        
        .qr-section.active {
            display: block;
        }
        
        #qrcode {
            display: inline-block;
            padding: 1rem;
            background: #fff;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .share-url {
            font-size: 0.875rem;
            word-break: break-all;
            color: #94a3b8;
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .mic-section {
            display: none;
            text-align: center;
        }
        
        .mic-section.active {
            display: block;
        }
        
        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 4px solid #7f1d1d;
        }
        
        .mic-button:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }
        
        .mic-button.recording {
            animation: recording-pulse 1.5s infinite;
        }
        
        @keyframes recording-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
        }
        
        .mic-icon {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }
        
        .mic-text {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .preview-section {
            display: none;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-text {
            font-size: 1.125rem;
            line-height: 1.6;
            color: #f1f5f9;
            min-height: 60px;
            padding: 1rem;
            background: #0f172a;
            border-radius: 0.5rem;
            border-left: 3px solid #38bdf8;
        }
        
        .preview-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .spinner.active {
            display: inline-block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Live<span>Caption</span> 🎤</h1>
        <div class="status waiting" id="status">
            <span class="status-dot"></span>
            <span id="status-text">Waiting</span>
        </div>
    </header>
    
    <main>
        <div class="card">
            <div class="card-title">Step 1: Start Session</div>
            <button class="btn-primary" id="start-session-btn" onclick="startSession()">
                Start Session
            </button>
        </div>
        
        <div class="card qr-section" id="qr-section">
            <div class="card-title">Step 2: Share with Audience</div>
            <div id="qrcode"></div>
            <div class="share-url" id="share-url"></div>
        </div>
        
        <div class="card mic-section" id="mic-section">
            <div class="card-title">Step 3: Start Captioning</div>
            <div class="mic-button" id="mic-btn" onclick="toggleRecording()">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
            <div class="mic-text" id="mic-text">Click to start</div>
        </div>
        
        <div class="card preview-section" id="preview-section">
            <div class="card-title">Live Preview</div>
            <div class="preview-label">English</div>
            <div class="preview-text" id="preview-text">
                <div class="spinner" id="spinner"></div>
                <span id="preview-content">Waiting for captions...</span>
            </div>
        </div>
    </main>
    
    <script>
        let sessionId = null;
        let recognition = null;
        let isRecording = false;
        let interimDebounce = null;
        let lastSentInterim = '';
        let lastSentFinal = '';
        
        async function startSession() {
            const btn = document.getElementById('start-session-btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            try {
                const response = await fetch('/api/session', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                sessionId = data.session_id;
                
                // Show QR code section
                const qrSection = document.getElementById('qr-section');
                qrSection.classList.add('active');
                
                // Generate QR code
                const shareUrl = `${window.location.origin}/audience.html?session=${sessionId}`;
                document.getElementById('share-url').textContent = shareUrl;
                
                new QRCode(document.getElementById('qrcode'), {
                    text: shareUrl,
                    width: 180,
                    height: 180,
                    colorDark: '#0f172a',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
                
                // Show mic section
                document.getElementById('mic-section').classList.add('active');
                
                btn.textContent = 'Session Created';
                
            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'Start Session';
                alert('Failed to create session: ' + error.message);
            }
        }
        
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        function startRecording() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert('Speech Recognition is not supported in this browser. Please use Chrome or Edge.');
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            
            recognition.onresult = (event) => {
                let interimText = '';
                let finalText = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += transcript;
                    } else {
                        interimText += transcript;
                    }
                }
                
                const previewContent = document.getElementById('preview-content');
                document.getElementById('spinner').classList.remove('active');
                
                if (finalText) {
                    // Final result: show white, send for translation
                    previewContent.innerHTML = finalText;
                    sendToServer(finalText.trim(), true);
                } else if (interimText) {
                    // Interim: show grey, push English to Supabase (debounced)
                    previewContent.innerHTML = '<span style="color:#94a3b8">' + interimText + '</span>';
                    sendInterim(interimText.trim());
                }
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow microphone access.');
                    stopRecording();
                }
            };
            
            recognition.onend = () => {
                // Auto-restart if still recording (browser stops after silence)
                if (isRecording) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log('Restarting recognition...');
                    }
                }
            };
            
            try {
                recognition.start();
                isRecording = true;
                document.getElementById('mic-btn').classList.add('recording');
                document.getElementById('mic-text').textContent = 'Click to stop';
                document.getElementById('preview-section').classList.add('active');
                document.getElementById('spinner').classList.add('active');
                updateStatus('live');
            } catch (error) {
                alert('Failed to start speech recognition: ' + error.message);
            }
        }
        
        function stopRecording() {
            isRecording = false;
            
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            
            if (interimDebounce) {
                clearTimeout(interimDebounce);
            }
            
            document.getElementById('mic-btn').classList.remove('recording');
            document.getElementById('mic-text').textContent = 'Click to start';
            document.getElementById('spinner').classList.remove('active');
            updateStatus('waiting');
        }
        
        // Send interim text to server (debounced, English-only update)
        function sendInterim(text) {
            if (!sessionId || !text || text === lastSentInterim) return;
            lastSentInterim = text;
            
            if (interimDebounce) clearTimeout(interimDebounce);
            interimDebounce = setTimeout(() => {
                fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        session_id: sessionId,
                        is_final: false
                    })
                }).catch(err => console.error('Interim send failed:', err));
            }, 500);  // Update English every 500ms while speaking
        }
        
        // Send final text for translation
        function sendToServer(text, isFinal) {
            if (!sessionId || !text) return;
            if (isFinal && text === lastSentFinal) return;
            if (isFinal) lastSentFinal = text;
            
            // Cancel any pending interim
            if (interimDebounce) clearTimeout(interimDebounce);
            
            fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    session_id: sessionId,
                    is_final: isFinal
                })
            }).then(res => res.json()).then(data => {
                if (data.error) console.error('Translation error:', data.error);
            }).catch(err => console.error('Translation failed:', err));
        }
        
        function updateStatus(status) {
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('status-text');
            
            statusEl.className = 'status ' + status;
            statusText.textContent = status === 'live' ? 'Live' : 'Waiting';
        }
        
        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (isRecording) {
                stopRecording();
            }
        });
    </script>
</body>
</html>
