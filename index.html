<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCaption - Presenter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #f8fafc;
        }
        
        h1 span {
            color: #38bdf8;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .status.waiting {
            background: #334155;
            color: #94a3b8;
        }
        
        .status.live {
            background: #dc2626;
            color: #fef2f2;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        
        main {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        
        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 1rem;
        }
        
        button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #0ea5e9;
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: #dc2626;
            color: #fef2f2;
        }
        
        .btn-danger:hover {
            background: #b91c1c;
        }
        
        .qr-section {
            display: none;
            text-align: center;
        }
        
        .qr-section.active {
            display: block;
        }
        
        #qrcode {
            display: inline-block;
            padding: 1rem;
            background: #fff;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .share-url {
            font-size: 0.875rem;
            word-break: break-all;
            color: #94a3b8;
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .mic-section {
            display: none;
            text-align: center;
        }
        
        .mic-section.active {
            display: block;
        }
        
        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 4px solid #7f1d1d;
        }
        
        .mic-button:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }
        
        .mic-button.recording {
            animation: recording-pulse 1.5s infinite;
        }
        
        @keyframes recording-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
        }
        
        .mic-icon {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }
        
        .mic-text {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .preview-section {
            display: none;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-text {
            font-size: 1.125rem;
            line-height: 1.6;
            color: #f1f5f9;
            min-height: 60px;
            padding: 1rem;
            background: #0f172a;
            border-radius: 0.5rem;
            border-left: 3px solid #38bdf8;
        }
        
        .preview-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .spinner.active {
            display: inline-block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Live<span>Caption</span> 🎤</h1>
        <div class="status waiting" id="status">
            <span class="status-dot"></span>
            <span id="status-text">Waiting</span>
        </div>
    </header>
    
    <main>
        <div class="card">
            <div class="card-title">Step 1: Start Session</div>
            <button class="btn-primary" id="start-session-btn" onclick="startSession()">
                Start Session
            </button>
        </div>
        
        <div class="card qr-section" id="qr-section">
            <div class="card-title">Step 2: Share with Audience</div>
            <div id="qrcode"></div>
            <div class="share-url" id="share-url"></div>
        </div>
        
        <div class="card mic-section" id="mic-section">
            <div class="card-title">Step 3: Start Captioning</div>
            <div class="mic-button" id="mic-btn" onclick="toggleRecording()">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
            <div class="mic-text" id="mic-text">Click to start</div>
        </div>
        
        <div class="card preview-section" id="preview-section">
            <div class="card-title">Live Preview</div>
            <div class="preview-label">English</div>
            <div class="preview-text" id="preview-text">
                <div class="spinner" id="spinner"></div>
                <span id="preview-content">Waiting for captions...</span>
            </div>
        </div>
    </main>
    
    <script>
        let sessionId = null;
        let peerConnection = null;
        let dataChannel = null;
        let localStream = null;
        let isRecording = false;
        let translateTimeout = null;
        let currentTranscript = '';
        let lastSentText = '';
        
        async function startSession() {
            const btn = document.getElementById('start-session-btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            try {
                const response = await fetch('/api/session', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                sessionId = data.session_id;
                
                // Show QR code section
                const qrSection = document.getElementById('qr-section');
                qrSection.classList.add('active');
                
                // Generate QR code
                const shareUrl = `${window.location.origin}/audience.html?session=${sessionId}`;
                document.getElementById('share-url').textContent = shareUrl;
                
                new QRCode(document.getElementById('qrcode'), {
                    text: shareUrl,
                    width: 180,
                    height: 180,
                    colorDark: '#0f172a',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
                
                // Show mic section
                document.getElementById('mic-section').classList.add('active');
                
                btn.textContent = 'Session Created';
                
            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'Start Session';
                alert('Failed to create session: ' + error.message);
            }
        }
        
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }
        
        async function startRecording() {
            try {
                console.log('🎤 Starting recording...');
                
                // 1. Get ephemeral token from our server
                console.log('📡 Getting API key from server...');
                const tokenRes = await fetch('/api/realtime-token');
                const tokenData = await tokenRes.json();
                
                console.log('📋 Token response:', tokenData);
                
                if (tokenData.error) {
                    throw new Error(tokenData.error);
                }
                
                const ephemeralKey = tokenData.client_secret?.value;
                if (!ephemeralKey) {
                    throw new Error('No API key returned from server');
                }
                
                console.log('✅ Got API key (length:', ephemeralKey.length, ')');
                
                // 2. Get microphone
                console.log('🎙️ Requesting microphone access...');
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                console.log('✅ Microphone access granted');
                
                // 3. Create WebRTC peer connection
                console.log('🔗 Creating WebRTC peer connection...');
                peerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                });
                
                // Add connection state logging
                peerConnection.onconnectionstatechange = () => {
                    console.log('🔌 WebRTC connection state:', peerConnection.connectionState);
                };
                
                peerConnection.oniceconnectionstatechange = () => {
                    console.log('❄️ ICE connection state:', peerConnection.iceConnectionState);
                };
                
                // Add audio track
                localStream.getAudioTracks().forEach(track => {
                    console.log('🎵 Adding audio track:', track.kind, track.label);
                    peerConnection.addTrack(track, localStream);
                });
                
                // Create data channel for receiving events
                console.log('📡 Creating data channel...');
                dataChannel = peerConnection.createDataChannel('oai-events');
                
                dataChannel.onopen = () => {
                    console.log('✅ Data channel open - sending session config');
                    // Configure the session for transcription only
                    dataChannel.send(JSON.stringify({
                        type: 'session.update',
                        session: {
                            modalities: ['text'],
                            input_audio_transcription: {
                                model: 'gpt-realtime-whisper'
                            },
                            turn_detection: {
                                type: 'server_vad',
                                threshold: 0.5,
                                prefix_padding_ms: 300,
                                silence_duration_ms: 500
                            }
                        }
                    }));
                };
                
                dataChannel.onerror = (error) => {
                    console.error('❌ Data channel error:', error);
                };
                
                dataChannel.onclose = () => {
                    console.log('🔌 Data channel closed');
                };
                
                dataChannel.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('📨 Received event:', data.type);
                        handleRealtimeEvent(data);
                    } catch (e) {
                        console.error('❌ Failed to parse event:', event.data);
                    }
                };
                
                // 4. Create offer
                console.log('📤 Creating WebRTC offer...');
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                console.log('✅ WebRTC offer created');
                
                // Wait for ICE gathering to complete
                await new Promise(resolve => {
                    if (peerConnection.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        peerConnection.onicegatheringstatechange = () => {
                            if (peerConnection.iceGatheringState === 'complete') {
                                resolve();
                            }
                        };
                    }
                });
                
                console.log('🧊 ICE gathering complete');
                
                // 5. Send offer to OpenAI Realtime API
                console.log('📡 Sending offer to OpenAI Realtime API...');
                const sdpResponse = await fetch(
                    'https://api.openai.com/v1/realtime?model=gpt-realtime-mini',
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${ephemeralKey}`,
                            'Content-Type': 'application/sdp'
                        },
                        body: offer.sdp
                    }
                );
                
                console.log('📋 OpenAI response status:', sdpResponse.status);
                
                if (!sdpResponse.ok) {
                    const errText = await sdpResponse.text();
                    console.error('❌ WebRTC signaling failed:', errText);
                    throw new Error(`WebRTC signaling failed (${sdpResponse.status}): ${errText}`);
                }
                
                // 6. Set remote description
                const answerSdp = await sdpResponse.text();
                console.log('📥 Received answer from OpenAI');
                await peerConnection.setRemoteDescription({
                    type: 'answer',
                    sdp: answerSdp
                });
                console.log('✅ Remote description set');
                
                // Update UI
                isRecording = true;
                document.getElementById('mic-btn').classList.add('recording');
                document.getElementById('mic-text').textContent = 'Click to stop';
                document.getElementById('preview-section').classList.add('active');
                document.getElementById('spinner').classList.add('active');
                updateStatus('live');
                
                console.log('🎉 WebRTC connection established - streaming audio');
                
            } catch (error) {
                console.error('❌ Failed to start recording:', error);
                alert('Failed to start: ' + error.message);
                stopRecording();
            }
        }
        
        function handleRealtimeEvent(event) {
            // Handle different event types from OpenAI Realtime API
            switch (event.type) {
                case 'conversation.item.input_audio_transcription.delta':
                    // Streaming partial transcription
                    if (event.delta) {
                        currentTranscript += event.delta;
                        document.getElementById('spinner').classList.remove('active');
                        document.getElementById('preview-content').textContent = currentTranscript;
                    }
                    break;
                    
                case 'conversation.item.input_audio_transcription.completed':
                    // Final transcription for this speech segment
                    if (event.transcript) {
                        currentTranscript = event.transcript;
                        document.getElementById('spinner').classList.remove('active');
                        document.getElementById('preview-content').textContent = currentTranscript;
                    }
                    // Send for translation
                    sendForTranslation(currentTranscript);
                    currentTranscript = '';
                    break;
                    
                case 'input_audio_buffer.speech_started':
                    document.getElementById('spinner').classList.add('active');
                    break;
                    
                case 'input_audio_buffer.speech_stopped':
                    document.getElementById('spinner').classList.remove('active');
                    break;
                    
                case 'error':
                    console.error('Realtime API error:', event.error);
                    break;
                    
                default:
                    // Log other events for debugging
                    if (event.type !== 'response.done' && event.type !== 'session.created' && event.type !== 'session.updated') {
                        console.log('Realtime event:', event.type);
                    }
                    break;
            }
        }
        
        function sendForTranslation(text) {
            if (!text || !text.trim() || !sessionId) return;
            if (text.trim() === lastSentText) return;  // Skip duplicates
            
            lastSentText = text.trim();
            
            // Fire-and-forget translation
            fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text.trim(),
                    session_id: sessionId
                })
            }).then(res => res.json()).then(data => {
                if (data.error) {
                    console.error('Translation error:', data.error);
                }
            }).catch(err => console.error('Translation failed:', err));
        }
        
        function stopRecording() {
            isRecording = false;
            
            // Close data channel
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }
            
            // Close peer connection
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            // Stop audio tracks
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            currentTranscript = '';
            lastSentText = '';
            
            document.getElementById('mic-btn').classList.remove('recording');
            document.getElementById('mic-text').textContent = 'Click to start';
            document.getElementById('spinner').classList.remove('active');
            
            updateStatus('waiting');
        }
        
        function updateStatus(status) {
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('status-text');
            
            statusEl.className = 'status ' + status;
            statusText.textContent = status === 'live' ? 'Live' : 'Waiting';
        }
        
        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (isRecording) {
                stopRecording();
            }
        });
    </script>
</body>
</html>
