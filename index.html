<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCaption - Presenter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #f8fafc;
        }
        
        h1 span {
            color: #38bdf8;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .status.waiting {
            background: #334155;
            color: #94a3b8;
        }
        
        .status.live {
            background: #dc2626;
            color: #fef2f2;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        
        main {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        
        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 1rem;
        }
        
        button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #0ea5e9;
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: #dc2626;
            color: #fef2f2;
        }
        
        .btn-danger:hover {
            background: #b91c1c;
        }
        
        .qr-section {
            display: none;
            text-align: center;
        }
        
        .qr-section.active {
            display: block;
        }
        
        #qrcode {
            display: inline-block;
            padding: 1rem;
            background: #fff;
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .share-url {
            font-size: 0.875rem;
            word-break: break-all;
            color: #94a3b8;
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            text-decoration: none;
            display: block;
        }
        .share-url:hover {
            color: #60a5fa;
            text-decoration: underline;
        }
        
        .mic-section {
            display: none;
            text-align: center;
        }
        
        .mic-section.active {
            display: block;
        }
        
        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 4px solid #7f1d1d;
        }
        
        .mic-button:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }
        
        .mic-button.recording {
            animation: recording-pulse 1.5s infinite;
        }
        
        @keyframes recording-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
        }
        
        .mic-icon {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }
        
        .mic-text {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .preview-section {
            display: none;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-text {
            font-size: 1.125rem;
            line-height: 1.6;
            color: #f1f5f9;
            min-height: 60px;
            max-height: 220px;
            overflow-y: auto;
            padding: 1rem;
            background: #0f172a;
            border-radius: 0.5rem;
            border-left: 3px solid #38bdf8;
            scroll-behavior: smooth;
        }

        .preview-text::-webkit-scrollbar {
            width: 6px;
        }

        .preview-text::-webkit-scrollbar-track {
            background: transparent;
        }

        .preview-text::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        .preview-text::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        .preview-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .spinner.active {
            display: inline-block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        
        .stt-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 9999px;
            color: #38bdf8;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Live<span>Caption</span> 🎤</h1>
        <div class="status waiting" id="status">
            <span class="status-dot"></span>
            <span id="status-text">Waiting</span>
        </div>
        <span class="stt-badge" id="stt-badge" style="display:none"></span>
    </header>
    
    <main>
        <div class="card">
            <div class="card-title">Step 1: Start Session</div>
            <button class="btn-primary" id="start-session-btn" onclick="startSession()">
                Start Session
            </button>
        </div>
        
        <div class="card qr-section" id="qr-section">
            <div class="card-title">Step 2: Share with Audience</div>
            <div id="qrcode"></div>
            <a class="share-url" id="share-url" target="_blank" rel="noopener noreferrer"></a>
        </div>
        
        <div class="card mic-section" id="mic-section">
            <div class="card-title">Step 3: Start Captioning</div>
            <div class="mic-button" id="mic-btn" onclick="toggleRecording()">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
            <div class="mic-text" id="mic-text">Click to start</div>
        </div>
        
        <div class="card preview-section" id="preview-section">
            <div class="card-title">Live Preview</div>
            <div class="preview-label">English</div>
            <div class="preview-text" id="preview-text">
                <div class="spinner" id="spinner"></div>
                <span id="preview-content">Waiting for captions...</span>
            </div>
        </div>
    </main>
    
    <script>
        let sessionId = null;
        let isRecording = false;
        let interimDebounce = null;
        let lastSentInterim = '';
        let lastSentFinal = '';
        let fullTranscript = '';  // Accumulated finalized text
        let currentInterim = '';  // Current interim text (not yet finalized)
        let lastInterimTime = 0;
        let lastActivityTime = 0;
        let recognitionStartTime = 0;
        let preemptiveRestartTimer = null;
        let watchdogTimer = null;
        let livenessTimer = null;
        let isRestarting = false;
        
        // STT provider config (loaded from server)
        let sttProvider = 'webspeech';  // 'deepgram' or 'webspeech'
        let deepgramApiKey = '';
        
        // Deepgram state
        let dgSocket = null;
        let mediaRecorder = null;
        let dgKeepAliveTimer = null;
        let dgWatchdogTimer = null;
        let mediaStream = null;
        
        // Web Speech API state (fallback)
        let recognition = null;
        
        // Load STT config from server
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                if (config.deepgram_api_key) {
                    deepgramApiKey = config.deepgram_api_key;
                    sttProvider = 'deepgram';
                    console.log('STT provider: Deepgram Nova-3');
                } else {
                    sttProvider = 'webspeech';
                    console.log('STT provider: Web Speech API (fallback)');
                }
            } catch (e) {
                console.warn('Failed to load config, using Web Speech API:', e);
                sttProvider = 'webspeech';
            }
        }
        
        // Initialize config on page load
        loadConfig();
        
        async function startSession() {
            const btn = document.getElementById('start-session-btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            try {
                const response = await fetch('/api/session', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                sessionId = data.session_id;
                
                // Show QR code section
                const qrSection = document.getElementById('qr-section');
                qrSection.classList.add('active');
                
                // Generate QR code
                const shareUrl = `${window.location.origin}/audience.html?session=${sessionId}`;
                const shareUrlEl = document.getElementById('share-url');
                shareUrlEl.textContent = shareUrl;
                shareUrlEl.href = shareUrl;
                
                new QRCode(document.getElementById('qrcode'), {
                    text: shareUrl,
                    width: 180,
                    height: 180,
                    colorDark: '#0f172a',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
                
                // Show mic section
                document.getElementById('mic-section').classList.add('active');
                
                btn.textContent = 'Session Created';
                
            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'Start Session';
                alert('Failed to create session: ' + error.message);
            }
        }
        
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
        
        // ========================================
        // Deepgram WebSocket STT
        // ========================================
        
        async function startDeepgram() {
            try {
                // Clean up any previous connection first
                if (dgSocket) {
                    try { dgSocket.onclose = null; dgSocket.onerror = null; dgSocket.close(); } catch(e) {}
                    dgSocket = null;
                }
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    try { mediaRecorder.stop(); } catch(e) {}
                    mediaRecorder = null;
                }
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                }
                
                // Get mic with optimized audio settings
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                // Strip "Deepgram:" prefix if present
                let key = deepgramApiKey;
                if (key.startsWith('Deepgram:')) {
                    key = key.substring('Deepgram:'.length);
                }
                
                console.log('Connecting to Deepgram, key:', key.slice(0, 8) + '...');
                
                // Build WebSocket URL
                const dgParams = new URLSearchParams({
                    model: 'nova-3',
                    language: 'en',
                    smart_format: 'true',
                    interim_results: 'true',
                    endpointing: '300',
                    utterance_end_ms: '1500'
                });
                
                const wsUrl = `wss://api.deepgram.com/v1/listen?${dgParams.toString()}`;
                console.log('WebSocket URL:', wsUrl);
                
                dgSocket = new WebSocket(wsUrl, ['token', key]);
                
                dgSocket.onopen = () => {
                    console.log('Deepgram WebSocket connected!');
                    lastActivityTime = Date.now();

                    // Keep-alive: prevent Deepgram from closing the connection during silence
                    if (dgKeepAliveTimer) clearInterval(dgKeepAliveTimer);
                    dgKeepAliveTimer = setInterval(() => {
                        if (dgSocket && dgSocket.readyState === WebSocket.OPEN) {
                            dgSocket.send(JSON.stringify({ type: 'KeepAlive' }));
                        }
                    }, 8000);

                    // Watchdog: if no transcript activity for 30s, assume connection is stuck and reconnect
                    startDeepgramWatchdog();

                    // Start MediaRecorder with Opus codec, 20ms chunks
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                        ? 'audio/webm;codecs=opus'
                        : 'audio/webm';

                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType });

                    mediaRecorder.ondataavailable = ({ data }) => {
                        if (dgSocket && dgSocket.readyState === WebSocket.OPEN && data.size > 0) {
                            dgSocket.send(data);
                        }
                    };

                    mediaRecorder.onerror = (e) => {
                        console.error('MediaRecorder error:', e);
                        if (isRecording && !isRestarting) {
                            isRestarting = true;
                            stopDeepgram();
                            setTimeout(() => {
                                if (isRecording) { isRestarting = false; startDeepgram(); }
                            }, 1000);
                        }
                    };

                    mediaRecorder.start(20);  // 20ms chunks for minimal latency
                    console.log(`MediaRecorder started: ${mimeType}, 20ms chunks`);
                };
                
                dgSocket.onmessage = ({ data }) => {
                    lastActivityTime = Date.now();
                    const msg = JSON.parse(data);
                    
                    // Remove spinner on any result
                    if (msg.type === 'Results' || msg.type === 'SpeechStarted') {
                        document.getElementById('spinner').classList.remove('active');
                    }
                    
                    // Handle transcription results
                    if (msg.type === 'Results' && msg.channel?.alternatives?.[0]) {
                        const transcript = msg.channel.alternatives[0].transcript;
                        if (!transcript || !transcript.trim()) return;
                        
                        const previewContent = document.getElementById('preview-content');
                        
                        if (msg.is_final) {
                            fullTranscript += transcript + ' ';
                            currentInterim = '';
                            previewContent.textContent = fullTranscript;
                            scrollPreviewToBottom();
                            sendToServer(fullTranscript.trim(), true);
                        } else {
                            currentInterim = transcript;
                            lastInterimTime = Date.now();
                            const display = fullTranscript + transcript;
                            previewContent.innerHTML = escapeHtml(fullTranscript) +
                                '<span style="color:#94a3b8;font-style:italic">' +
                                escapeHtml(transcript) + '</span>';
                            scrollPreviewToBottom();
                            sendInterim(display.trim());
                        }
                    }
                };
                
                dgSocket.onerror = (err) => {
                    console.error('Deepgram WebSocket error:', err);
                    if (isRecording && !isRestarting) {
                        stopDeepgram();
                        fallbackToWebSpeech();
                    }
                };
                
                dgSocket.onclose = (event) => {
                    console.log('Deepgram closed:', event.code, event.reason);
                    if (dgKeepAliveTimer) { clearInterval(dgKeepAliveTimer); dgKeepAliveTimer = null; }
                    if (isRecording && !isRestarting) {
                        isRestarting = true;
                        console.log('Deepgram disconnected while recording, reconnecting...');
                        setTimeout(() => {
                            if (isRecording) {
                                isRestarting = false;
                                startDeepgram();
                            }
                        }, 1000);
                    }
                };
                
            } catch (error) {
                console.error('Deepgram start failed:', error);
                fallbackToWebSpeech();
            }
        }
        
        function fallbackToWebSpeech() {
            if (!isRecording) return;
            console.log('Falling back to Web Speech API');
            sttProvider = 'webspeech';
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = createRecognition();
                recognition.start();
                startWatchdogs();
                document.getElementById('stt-badge').textContent = 'Web Speech API (fallback)';
            } else {
                alert('Speech recognition not supported in this browser');
                stopRecording();
            }
        }
        
        function startDeepgramWatchdog() {
            stopDeepgramWatchdog();
            dgWatchdogTimer = setInterval(() => {
                if (!isRecording || isRestarting) return;
                const idleMs = Date.now() - lastActivityTime;
                if (idleMs > 30000) {
                    console.warn('Deepgram watchdog: no activity for', idleMs, 'ms, reconnecting...');
                    isRestarting = true;
                    stopDeepgram();
                    setTimeout(() => {
                        if (isRecording) { isRestarting = false; startDeepgram(); }
                    }, 1000);
                }
            }, 10000);
        }

        function stopDeepgramWatchdog() {
            if (dgWatchdogTimer) { clearInterval(dgWatchdogTimer); dgWatchdogTimer = null; }
        }

        function stopDeepgram() {
            stopDeepgramWatchdog();
            if (dgKeepAliveTimer) { clearInterval(dgKeepAliveTimer); dgKeepAliveTimer = null; }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) {}
            }
            mediaRecorder = null;
            
            if (dgSocket) {
                try {
                    if (dgSocket.readyState === WebSocket.OPEN) {
                        dgSocket.send(JSON.stringify({ type: 'CloseStream' }));
                    }
                    dgSocket.close();
                } catch (e) {}
                dgSocket = null;
            }
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
        }
        
        function scrollPreviewToBottom() {
            const box = document.getElementById('preview-text');
            if (box) box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ========================================
        // Web Speech API (fallback)
        // ========================================
        
        function createRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.lang = 'en-US';
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 1;
            
            rec.onresult = (event) => {
                lastActivityTime = Date.now();
                let interimText = '';
                let newFinal = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        newFinal += transcript;
                    } else {
                        interimText += transcript;
                    }
                }
                
                const previewContent = document.getElementById('preview-content');
                document.getElementById('spinner').classList.remove('active');
                
                if (newFinal) {
                    fullTranscript += newFinal;
                    currentInterim = '';
                    previewContent.textContent = fullTranscript;
                    scrollPreviewToBottom();
                    sendToServer(fullTranscript.trim(), true);
                } else if (interimText) {
                    currentInterim = interimText;
                    lastInterimTime = Date.now();
                    const display = fullTranscript + interimText;
                    previewContent.innerHTML = escapeHtml(fullTranscript) + '<span style="color:#94a3b8;font-style:italic">' + escapeHtml(interimText) + '</span>';
                    scrollPreviewToBottom();
                    sendInterim(display.trim());
                }
            };
            
            rec.onstart = () => {
                lastActivityTime = Date.now();
                recognitionStartTime = Date.now();
                isRestarting = false;
                console.log('Recognition started');
                // Start liveness check
                startLivenessCheck();
            };
            
            rec.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    alert('Microphone access denied. Please allow microphone access.');
                    stopRecording();
                }
                // Other errors (no-speech, aborted, network) - let onend handle restart
            };
            
            rec.onend = () => {
                console.log('Recognition ended, isRecording:', isRecording);
                if (isRecording) {
                    safeRestart();
                }
            };
            
            return rec;
        }
        
        // Centralized safe restart logic - preserves interim text
        function safeRestart() {
            if (!isRecording || isRestarting) return;
            isRestarting = true;
            
            // CRITICAL: preserve any in-progress interim text so we don't lose words
            if (currentInterim && currentInterim.trim()) {
                fullTranscript += currentInterim;
                if (!fullTranscript.endsWith(' ')) fullTranscript += ' ';
                console.log('Preserved interim before restart:', currentInterim);
                currentInterim = '';
                // Update preview
                const previewContent = document.getElementById('preview-content');
                if (previewContent) previewContent.textContent = fullTranscript;
                // Send to server as final (so audience gets the words)
                sendToServer(fullTranscript.trim(), true);
            }
            
            // Try to stop current instance cleanly
            if (recognition) {
                try {
                    recognition.onend = null;
                    recognition.onerror = null;
                    recognition.onresult = null;
                    recognition.onstart = null;
                    recognition.abort();
                } catch (e) {}
            }
            
            setTimeout(() => {
                if (!isRecording) {
                    isRestarting = false;
                    return;
                }
                try {
                    recognition = createRecognition();
                    recognition.start();
                    console.log('Recognition restarted');
                } catch (e) {
                    console.error('Restart failed, retrying...', e);
                    setTimeout(() => {
                        if (isRecording) {
                            try {
                                recognition = createRecognition();
                                recognition.start();
                            } catch (err) {
                                console.error('Second restart failed:', err);
                                isRestarting = false;
                            }
                        }
                    }, 500);
                }
            }, 250);
        }
        
        // Defer restart while user is actively speaking (interim < 1s old)
        function deferredRestart(reason) {
            if (!isRecording || isRestarting) return;
            
            const interimAge = Date.now() - lastInterimTime;
            const userSpeaking = currentInterim && interimAge < 1000;
            
            if (userSpeaking) {
                // Wait until user pauses, retry shortly
                console.log('Deferring restart (user speaking):', reason);
                setTimeout(() => deferredRestart(reason), 1500);
                return;
            }
            
            console.log('Restart trigger:', reason);
            safeRestart();
        }
        
        // Liveness check: detect if recognition started but isn't emitting events
        function startLivenessCheck() {
            stopLivenessCheck();
            livenessTimer = setInterval(() => {
                if (!isRecording) return;

                const timeSinceActivity = Date.now() - lastActivityTime;

                // recognition is null means a previous restart failed — try again
                if (!recognition && !isRestarting) {
                    console.warn('Liveness: recognition is null, restarting...');
                    hardResetRecognition();
                    return;
                }

                const timeSinceStart = Date.now() - recognitionStartTime;

                // If started > 3s ago but no activity for > 15s, it's likely dead
                if (timeSinceStart > 3000 && timeSinceActivity > 15000 && !isRestarting) {
                    console.warn('Liveness: recognition appears dead, hard resetting...');
                    hardResetRecognition();
                }
            }, 2000);
        }
        
        function stopLivenessCheck() {
            if (livenessTimer) clearInterval(livenessTimer);
            livenessTimer = null;
        }
        
        // Nuclear option: completely destroy and recreate everything
        function hardResetRecognition() {
            if (!isRecording || isRestarting) return;
            isRestarting = true;
            
            console.log('HARD RESET: destroying recognition instance');
            
            // Preserve any interim text
            if (currentInterim && currentInterim.trim()) {
                fullTranscript += currentInterim;
                if (!fullTranscript.endsWith(' ')) fullTranscript += ' ';
                currentInterim = '';
            }
            
            // Kill the instance completely
            if (recognition) {
                try { recognition.abort(); } catch (e) {}
                try { recognition.stop(); } catch (e) {}
                recognition = null;
            }
            
            // Wait longer for Chrome to clean up
            setTimeout(() => {
                if (!isRecording) {
                    isRestarting = false;
                    return;
                }
                
                try {
                    recognition = createRecognition();
                    recognition.start();
                    console.log('HARD RESET: recognition restarted');
                } catch (e) {
                    console.error('Hard reset failed:', e);
                    isRestarting = false;
                    // Try one more time
                    setTimeout(() => {
                        if (isRecording && !recognition) {
                            try {
                                recognition = createRecognition();
                                recognition.start();
                            } catch (err) {
                                console.error('Final hard reset attempt failed');
                            }
                        }
                    }, 1000);
                }
            }, 500);
        }
        
        // Watchdog: detect if recognition has been silent too long (Chrome bug)
        function startWatchdogs() {
            stopWatchdogs();
            lastActivityTime = Date.now();
            
            // Watchdog: if no event for 20s, force restart (Chrome can hang silently)
            watchdogTimer = setInterval(() => {
                if (!isRecording || isRestarting) return;
                const idleMs = Date.now() - lastActivityTime;
                if (idleMs > 20000) {
                    console.warn('Watchdog: no activity for', idleMs, 'ms');
                    safeRestart();  // Force restart - user clearly not speaking
                }
            }, 5000);
            
            // Preemptive restart every 45s during pauses (anti-stuck)
            preemptiveRestartTimer = setInterval(() => {
                if (!isRecording || isRestarting) return;
                deferredRestart('preemptive');
            }, 45000);
        }
        
        function stopWatchdogs() {
            if (watchdogTimer) clearInterval(watchdogTimer);
            if (preemptiveRestartTimer) clearInterval(preemptiveRestartTimer);
            stopLivenessCheck();
            watchdogTimer = null;
            preemptiveRestartTimer = null;
        }
        
        // ========================================
        // Unified start/stop
        // ========================================
        
        async function startRecording() {
            try {
                isRecording = true;
                isRestarting = false;
                
                // Reset transcript state fresh every session
                fullTranscript = '';
                currentInterim = '';
                lastSentInterim = '';
                lastSentFinal = '';
                if (interimDebounce) {
                    clearTimeout(interimDebounce);
                    interimDebounce = null;
                }
                
                // Clear preview
                const previewContent = document.getElementById('preview-content');
                if (previewContent) previewContent.textContent = '';
                
                if (sttProvider === 'deepgram') {
                    await startDeepgram();
                } else {
                    // Web Speech API fallback
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        alert('Speech Recognition is not supported in this browser. Please use Chrome or Edge.');
                        isRecording = false;
                        return;
                    }
                    recognition = createRecognition();
                    recognition.start();
                    startWatchdogs();
                }
                
                document.getElementById('mic-btn').classList.add('recording');
                document.getElementById('mic-text').textContent = 'Click to stop';
                document.getElementById('preview-section').classList.add('active');
                document.getElementById('spinner').classList.add('active');
                document.getElementById('stt-badge').textContent = sttProvider === 'deepgram' ? 'Deepgram Nova-3' : 'Web Speech API';
                document.getElementById('stt-badge').style.display = 'inline-block';
                updateStatus('live');
            } catch (error) {
                isRecording = false;
                alert('Failed to start speech recognition: ' + error.message);
            }
        }
        
        function stopRecording() {
            isRecording = false;
            isRestarting = false;
            
            if (sttProvider === 'deepgram') {
                stopDeepgram();
            } else {
                stopWatchdogs();
                stopLivenessCheck();
                if (recognition) {
                    try {
                        recognition.onend = null;
                        recognition.onerror = null;
                        recognition.onresult = null;
                        recognition.stop();
                    } catch (e) {}
                    recognition = null;
                }
            }
            
            if (interimDebounce) {
                clearTimeout(interimDebounce);
            }
            
            fullTranscript = '';
            currentInterim = '';
            
            document.getElementById('mic-btn').classList.remove('recording');
            document.getElementById('mic-text').textContent = 'Click to start';
            document.getElementById('spinner').classList.remove('active');
            document.getElementById('stt-badge').style.display = 'none';
            updateStatus('waiting');
        }
        
        // Keep API payloads small — audience only needs recent captions, not the full session
        const MAX_API_CHARS = 500;
        function recentText(text) {
            return text.length > MAX_API_CHARS ? text.slice(-MAX_API_CHARS) : text;
        }

        // Send interim text to server (debounced, English-only update)
        function sendInterim(text) {
            if (!sessionId || !text || text === lastSentInterim) return;
            lastSentInterim = text;

            if (interimDebounce) clearTimeout(interimDebounce);
            interimDebounce = setTimeout(() => {
                fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: recentText(text),
                        session_id: sessionId,
                        is_final: false
                    })
                }).catch(err => console.error('Interim send failed:', err));
            }, 150);  // 150ms debounce for near-instant interim updates
        }

        // Send final text for translation
        function sendToServer(text, isFinal) {
            if (!sessionId || !text) return;
            if (isFinal && text === lastSentFinal) return;

            // Compute the delta (new portion since last final) for stable translations
            let delta = '';
            if (isFinal) {
                if (text.startsWith(lastSentFinal)) {
                    delta = text.slice(lastSentFinal.length).trim();
                } else {
                    // Text was reset/replaced — translate the whole thing
                    delta = text;
                }
                lastSentFinal = text;
            }

            // Cancel any pending interim
            if (interimDebounce) clearTimeout(interimDebounce);

            fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: recentText(text),
                    delta: delta,
                    session_id: sessionId,
                    is_final: isFinal
                })
            }).then(res => res.json()).then(data => {
                if (data.error) console.error('Translation error:', data.error);
            }).catch(err => console.error('Translation failed:', err));
        }
        
        function updateStatus(status) {
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('status-text');
            
            statusEl.className = 'status ' + status;
            statusText.textContent = status === 'live' ? 'Live' : 'Waiting';
        }
        
        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (isRecording) {
                stopRecording();
            }
        });
    </script>
</body>
</html>
